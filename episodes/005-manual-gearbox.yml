pinned_comment: "Manual or automatic: which do you drive? Tell us below."
cover_frame_concept: "Two meshing 3D gears over a rev gauge. Big text: WRONG GEAR, WHAT BREAKS?"

# Claims checked against the pages below (read on 2026-11-21). No rpm or power figures used.
sources_status: VERIFIED
sources:
  - "HowStuffWorks, transmission: 'Cars need transmissions because of the physics of the gasoline engine'; engines have 'narrow rpm ranges where horsepower and torque are at their maximum'; 'You shift gears so the engine can stay below the redline and near the rpm band of its best performance'; the clutch 'lets you connect and disconnect the engine and the transmission'. https://www.howstuffworks.com/transmission.htm"
  - "Hagerty, how a manual transmission works: the transmission 'functions as a trade-off between wheel torque and wheel speed'; 'Lower gears provide high levels of torque multiplication needed to get the vehicle moving'; 'higher gears offer greater top speed capability'. https://www.hagerty.com/media/?p=8257"
  - "YourMechanic, how a manual transmission works: pressing the clutch pedal disengages the clutch so the driver can shift; engaged, 'the pressure plate pushes the clutch plate against the flywheel, locking the engine to the transmission'; shifting up reduces RPMs. (The page wrongly calls a manual a CVT; that claim is NOT used.) https://www.yourmechanic.com/article/how-a-manual-transmission-works"
  - "SlashGear, lugging: 'Lugging occurs when you push the throttle hard while the transmission is in high gear'; persistent lugging 'will disrupt the timing and cause it to run hotter than it should' and can cause 'piston and spark plug damage via low-speed pre-ignition'; an experienced driver downshifts. https://www.slashgear.com/1896138/lugging-engine-meaning-explained/"
  - "Hagerty, gear ratios and feel: the 2020 Mustang has 'an additional 25 hp and 20 lb-feet of torque' than the 2015, yet its more linear gear ratios make it 'feel slower across the board'. https://hagerty.com/media/?p=8839"
  - "NOTE: 'can be damaged' in the lug scene is softened from SlashGear's specific claims; the on-screen gauge positions are illustrative, not measured."

