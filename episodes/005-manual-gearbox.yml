titles:
  - Why Your Car Needs Gears (and What the Wrong One Does)
  - How a Manual Gearbox Really Works
  - What Happens to Your Engine in the Wrong Gear?
upload_title_index: 0

description: |
  Why does a car need gears at all? An engine works best in a narrow speed range, and gears keep it
  there. In under a minute: what low and high gear do, what the clutch is for, and what happens to
  the engine in the wrong gear.

  The animation is simplified and not to scale.

  Follow Cutaway to understand how the world works.
hashtags: ["#shorts", "#manualtransmission", "#cars", "#engineering", "#howitworks"]
