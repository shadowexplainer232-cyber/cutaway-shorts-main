scenes:
  - id: hook
    on_screen: "WHY DOES A CAR NEED GEARS?"
    text: "Why does a car need gears? And what happens to the engine in the wrong one?"
    visual: {type: gearbox, stage: engine, callout: "WRONG GEAR, WHAT BREAKS?"}
    sfx: [{name: whoosh, at: 0.2}]

  - id: range
    on_screen: "ENGINES HAVE A SWEET SPOT"
    text: "An engine works best in a narrow speed range. Gears keep it there."
    visual: {type: gearbox, stage: engine, callout: "GEARS KEEP THE ENGINE IN ITS BEST RANGE"}
    sfx: [{name: valve_click, at: 0.4}]

  - id: low
    on_screen: "1 · LOW GEAR"
    text: "Low gear multiplies torque to get moving, but limits speed."
    visual: {type: gearbox, stage: low, callout: "LOW GEAR: PUSH, NOT SPEED"}
    sfx: [{name: thump, at: 0.3, gain: 0.5}]

  - id: high
    on_screen: "2 · HIGH GEAR"
    text: "High gear gives top speed, and the engine turns slower."
    visual: {type: gearbox, stage: high, callout: "HIGH GEAR: SPEED, NOT PUSH"}
    sfx: [{name: whoosh, at: 0.3}]

  - id: clutch
    on_screen: "3 · THE CLUTCH"
