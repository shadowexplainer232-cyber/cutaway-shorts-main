  - id: hook
    on_screen: "THIS CONCRETE HEALS ITSELF?"
    text: "Roman buildings are still standing. And new research suggests their concrete can heal its own cracks."
    visual: {type: concrete, stage: heal, speed: 1.4, callout: "CAN CONCRETE REPAIR ITSELF?"}
    sfx: [{name: whoosh, at: 0.2}, {name: shimmer, at: 4.2, gain: 0.5}]

  - id: mix
    on_screen: "1 · THE RECIPE"
    text: "The Romans mixed volcanic ash with lime to make their concrete."
    visual: {type: concrete, stage: mix, callout: "VOLCANIC ASH + LIME"}
    sfx: [{name: valve_click, at: 0.5}]

  - id: dome
