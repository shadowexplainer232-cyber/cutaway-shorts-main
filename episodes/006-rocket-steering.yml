# Estimated narration: about 48 seconds at the slower pace. Check the build log.
scenes:
  - id: hook
    on_screen: "NO AIR. HOW DO ROCKETS STEER?"
    text: "There's no air in space. So what does a rocket push against to steer?"
    visual: {type: rocket_steer, stage: space, callout: "HOW DOES IT STEER?"}
    sfx: [{name: whoosh, at: 0.2}, {name: jet_spool, at: 3.0, gain: 0.5}]

  - id: push
    on_screen: "IT PUSHES ON ITS OWN EXHAUST"
    text: "A rocket pushes on its own exhaust, and the exhaust pushes back. No air needed."
    visual: {type: rocket_steer, stage: push, callout: "THE GAS PUSHES THE ROCKET"}
    sfx: [{name: exhaust_puff, at: 0.4}]

  - id: gimbal
    on_screen: "1 · SWIVEL THE ENGINE"
    text: "To turn, the engine can swivel. Tilt the nozzle, and the push changes direction."
    visual: {type: rocket_steer, stage: gimbal, callout: "TILT THE NOZZLE, TURN THE ROCKET"}
    sfx: [{name: valve_click, at: 1.0}]

  - id: thrusters
    on_screen: "2 · SMALL THRUSTERS"
    text: "Small thrusters on the sides fire in pairs to rotate the spacecraft."
    visual: {type: rocket_steer, stage: thrusters, callout: "TWO THRUSTERS, ONE TURN"}
    sfx: [{name: exhaust_puff, at: 1.1, gain: 0.5}, {name: exhaust_puff, at: 1.15, gain: 0.5}]

  - id: wheels
    on_screen: "3 · SPINNING WHEELS"
    text: "Some satellites spin internal wheels, and use their momentum to change direction."
    visual: {type: rocket_steer, stage: wheels, callout: "THE WHEEL'S MOMENTUM TURNS IT"}
    sfx: [{name: shimmer, at: 1.0, gain: 0.5}]

  - id: bonus
    on_screen: ""
    text: "One more thing. Rockets actually work better in space than in air."
    visual:
      type: fact_card
      label: "ONE MORE THING"
      lines: ["ROCKETS WORK BETTER", "IN SPACE", "THAN IN AIR"]
      colors: [accent, tech, text]
      sub: "air gets in the way (NASA)"
    sfx: [{name: ding, at: 0.3, gain: 0.5}]

  - id: question
    on_screen: ""
    text: "Thrusters or spinning wheels? Which would you steer with? Tell us in the comments."
    visual:
      type: fact_card
      label: "YOUR TURN"
      lines: ["THRUSTERS", "OR", "SPINNING WHEELS?"]
      colors: [tech, muted, accent]
    pause_after: 1.2          # a calm beat before the channel outro
    sfx: []

  - id: outro
    on_screen: ""
    text: "This is Cutaway. Understand how the world works. Follow for the next machine."
    visual: {type: outro}
    sfx: [{name: ding, at: 0.3}]
