# Estimated narration: about 55 seconds at the slower pace. Check the build log; if over 59 s, trim the bonus scene.
scenes:
  - id: hook
    on_screen: "SAME JOB. WHY SO DIFFERENT?"
    text: "Superchargers and turbochargers do the same job. So why do they feel so different to drive?"
    visual: {type: boost_compare, stage: intro, callout: "WHAT SPINS THEM?"}
    sfx: [{name: whoosh, at: 0.2}]

  - id: super
    on_screen: "1 · THE SUPERCHARGER"
    text: "A supercharger is driven by a belt from the engine itself. So it responds instantly."
    visual: {type: boost_compare, stage: super, callout: "BELT-DRIVEN: INSTANT RESPONSE"}
    sfx: [{name: intake_whoosh, at: 0.3}]

  - id: turbo
    on_screen: "2 · THE TURBO"
    text: "A turbo is driven by exhaust gas. That wastes less engine power, but it needs a moment to spin up."
    visual: {type: boost_compare, stage: turbo, callout: "EXHAUST-DRIVEN: A MOMENT TO SPIN UP"}
    sfx: [{name: exhaust_puff, at: 0.4}, {name: jet_spool, at: 3.0, gain: 0.5}]

  - id: diff
    on_screen: "WHAT SPINS IT DECIDES THE FEEL"
    text: "Same job, more air. The difference is what spins them."
    visual: {type: boost_compare, stage: diff, callout: "BELT = INSTANT  ·  EXHAUST = EFFICIENT"}
    sfx: [{name: shimmer, at: 0.2, gain: 0.6}]

  - id: bonus
    on_screen: ""
    text: "Some engines use both. The supercharger helps at low speed, then the turbo takes over."
    visual:
      type: fact_card
      label: "ONE MORE THING"
      lines: ["SOME ENGINES USE BOTH", "SUPERCHARGER FIRST, THEN TURBO"]
      colors: [accent, text]
      sub: "it's called twin-charging"
    sfx: [{name: ding, at: 0.3, gain: 0.5}]

  - id: question
    on_screen: ""
    text: "Would you pick instant response, or better efficiency? Tell us in the comments."
    visual:
      type: fact_card
      label: "YOUR TURN"
      lines: ["INSTANT RESPONSE", "OR", "BETTER EFFICIENCY?"]
      colors: [tech, muted, accent]
    pause_after: 1.2          # a calm beat before the channel outro
    sfx: []

  - id: outro
    on_screen: ""
    text: "This is Cutaway. Understand how the world works. Follow for the next machine."
    visual: {type: outro}
    sfx: [{name: ding, at: 0.3}]
