# If the 3D render fails, the same scene is drawn in 2D. Civilian fusion energy only (no weapons).
id: "012"
slug: nuclear-fusion
status: draft
category: Science & Energy
series: HOW IT ACTUALLY WORKS
synthetic_media: false   # procedural diagrams and a Blender-modelled scene, no realistic AI footage

# Chosen by the channel owner (the viewer poll in episode 009). Hook: the Sun runs on fusion,
# so can we build a tiny sun on Earth?
# Ending format: lesson -> bonus fact (with its catch) -> viewer question -> calm beat -> channel.
titles:
  - How Nuclear Fusion Works (A Tiny Sun on Earth)
  - Can We Build a Sun on Earth? Nuclear Fusion Explained
  - Fusion Power in 50 Seconds
upload_title_index: 0

description: |
  The Sun runs on fusion. Can we build a tiny sun on Earth to make electricity? In under a minute:
  what fusion is, why it needs extreme heat, how a tokamak holds the plasma with magnets, and how
  a power station would turn the energy into electricity.

  The animation is simplified and not to scale.

  Follow Cutaway to understand how the world works.
hashtags: ["#shorts", "#nuclearfusion", "#fusion", "#energy", "#howitworks"]
tags: [how nuclear fusion works, fusion energy explained, tokamak, plasma, fusion power, how the sun works, net energy gain]
pinned_comment: "Should we explain solar panels next? Tell us below."
cover_frame_concept: "Glowing plasma ring inside blue magnet coils. Big text: A SUN ON EARTH?"

# Claims checked against the pages below (read on 2026-11-22). Only the figures on those pages are used.
sources_status: VERIFIED
sources:
  - "UKAEA, 'How fusion energy works': energy is released when 'two light atomic nuclei fuse together to form one heavier atom'; on Earth 'the most efficient reaction is that between two types of hydrogen - deuterium and tritium'; they 'only fuse at temperatures over 100 million degrees Celsius'; 'The fusion plasma is heated and confined in a ring-shaped bottle known as a tokamak where strong magnetic fields control it'; 'A commercial fusion power station will use the energy carried by the neutrons to generate electricity.' https://www.ukaea.org/fusion-energy/how-fusion-works/"
  - "U.S. Department of Energy, 'DOE Explains... Fusion Energy Science': 'Fusion occurs when two nuclei combine to form a new nucleus'; 'This process occurs in our Sun and other stars'; 'Plasmas are gases that are so hot that electrons are freed from atomic nuclei'; tokamak is a 'magnetic confinement concept'. https://www.energy.gov/science/doe-explainsfusion-energy-science"
  - "Physics Today, 'National Ignition Facility surpasses long-awaited fusion milestone': the 5 December 2022 shot 'produced about 3.15 megajoules of fusion energy from the 2.05 MJ of laser light'; this was just 1% of the 300 MJ from the grid needed per laser shot; 'inertial fusion is still a long way from becoming a viable energy source'; at the time the findings had 'not been peer reviewed'. https://physicstoday.aip.org/news/national-ignition-facility-surpasses-long-awaited-fusion-milestone"
  - "NOTE: the animation is schematic (the heat-bar, the nuclei and the neutron are illustrative). Nothing is said about weapons. The 2022 result is stated as it was reported at the time, with its catch; check whether newer results exist before approving, because this field changes."

next_up: "How Solar Panels Work"   # planned, depends on the viewer vote

# Estimated narration: about 51 seconds at the slower pace. Check the build log.
scenes:
  - id: hook
    on_screen: "A SUN ON EARTH?"
    text: "The Sun runs on fusion. Can we build a tiny sun on Earth to make electricity?"
    visual: {type: fusion, stage: sun, callout: "CAN WE BUILD A TINY SUN?"}
    sfx: [{name: whoosh, at: 0.2}, {name: shimmer, at: 3.0, gain: 0.5}]

  - id: fuse
    on_screen: "1 · WHAT FUSION IS"
    text: "Fusion joins two light atomic nuclei into one heavier one, and that releases energy."
    visual: {type: fusion, stage: fuse, callout: "TWO LIGHT NUCLEI → ONE HEAVIER NUCLEUS"}
    sfx: [{name: spark_zap, at: 2.4, gain: 0.5}, {name: thump, at: 2.45, gain: 0.5}]

  - id: heat
    on_screen: "2 · THE HEAT"
    text: "It needs extreme heat, over a hundred million degrees. At that heat, matter becomes plasma."
    visual: {type: fusion, stage: heat, callout: "EXTREME HEAT IS REQUIRED"}
    sfx: [{name: jet_spool, at: 0.3, gain: 0.5}]

  - id: tokamak
    on_screen: "3 · THE TOKAMAK"
    text: "A ring-shaped machine called a tokamak holds the plasma with strong magnetic fields."
    visual: {type: fusion, stage: tokamak, callout: "MAGNETS HOLD THE PLASMA IN A RING"}
    sfx: [{name: valve_click, at: 0.5}, {name: shimmer, at: 3.5, gain: 0.4}]

  - id: power
    on_screen: "4 · THE POWER"
    text: "A power station would use the energy carried by neutrons to make electricity."
    visual: {type: fusion, stage: power, callout: "NEUTRONS CARRY THE ENERGY OUT"}
    sfx: [{name: exhaust_puff, at: 0.5, gain: 0.4}]

  - id: bonus
    on_screen: ""
    text: "In 2022, a US lab made more fusion energy than the laser light it used. The catch? The lasers needed far more power."
    visual:
      type: fact_card
      label: "ONE MORE THING"
      lines: ["MORE FUSION ENERGY", "THAN LASER LIGHT IN", "BUT THE LASERS NEEDED MORE"]
      colors: [accent, text, tech]
      sub: "NIF, 2022 (Physics Today)"
    sfx: [{name: ding, at: 0.3, gain: 0.5}]

  - id: question
    on_screen: ""
    text: "Should we explain solar panels next? Tell us in the comments."
    visual:
      type: fact_card
      label: "YOUR TURN"
      lines: ["SOLAR PANELS", "NEXT?"]
      colors: [accent, text]
    pause_after: 1.2          # a calm beat before the channel outro
    sfx: []

  - id: outro
    on_screen: ""
    text: "This is Cutaway. Understand how the world works. Follow for the next machine."
    visual: {type: outro}
    sfx: [{name: ding, at: 0.3}]
