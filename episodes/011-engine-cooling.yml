titles:
  - How a Car Radiator Keeps the Engine Cool
  - Why Doesn't Your Car Engine Destroy Itself?
  - How Your Engine Cooling System Really Works
upload_title_index: 0

description: |
  Burning fuel makes a lot of heat. So why doesn't your engine destroy itself? In under a minute:
  how coolant carries heat away, what the pump, radiator and thermostat do, and why air through
  the fins is the final step.

  The animation is simplified and not to scale.

  Follow Cutaway to understand how the world works.
hashtags: ["#shorts", "#radiator", "#engine", "#cars", "#howitworks"]
