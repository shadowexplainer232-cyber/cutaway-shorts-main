cover_frame_concept: "Cooling loop with red-hot coolant entering the radiator and blue coolant leaving. Big text: WHY DOESN'T IT DESTROY ITSELF?"

# Claims checked against the pages below (read on 2026-11-21). No temperatures or percentages used.
sources_status: VERIFIED
sources:
  - "HowStuffWorks, 'How Does an Engine Cooling System Work?': 'as a car burns fuel, it produces a surplus of heat'; 'The pump sends cooling fluid to the engine where it absorbs the engine's heat'; the radiator 'acts as a heat exchanger, releasing the surplus heat to the air'; 'If the cooling fluid is below the maximum temperature, the thermostat stays closed' and when hot, 'the thermostat's valve opens, routing the fluid through a radiator first'. https://auto.howstuffworks.com/engine-cooling-system.htm"
  - "Haynes, 'Car cooling: how does it work?': 'Propelled by the water pump, coolant flows from the radiator to the engine'; 'The heat passes from the coolant to the aluminium' and 'air comes in via the front grille and passes over these aluminium layers'; the thermostatically controlled valve 'opens, diverting the hot coolant to the radiator'; the fan 'pulls air through the radiator to help take away the heat'; too much heat 'will cause it to expand and seize'. https://haynes.com/en-gb/tips-tutorials/understanding-your-cars-cooling-system"
  - "YourMechanic, 'How does a radiator keep an engine cool?': hot coolant is split into 'multiple smaller tubes, known as core tubes' that pass through 'numerous thin sheets of folded metal called cooling fins'; outside air moving across the fins removes heat; 'Pressure generated by the water pump maintains the flow of coolant through the radiator'. https://www.yourmechanic.com/article/how-does-a-radiator-keep-an-engine-cool"
  - "Haynes, intercooler (episode 010): an intercooler 'does the same job as your radiator, but with air instead of water' (used in the bonus scene). https://haynes.com/en-gb/tips-tutorials/what-intercooler-and-how-does-it-work"
  - "NOTE: no claim is made about how a radiator cap or pressurised coolant works (the pages read did not cover it). The fan is shown on the radiator side as in a typical front-engine car; the animation is schematic."

